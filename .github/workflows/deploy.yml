name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change this if your default branch is 'master'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Inject API Key into HTML
        # This command searches for your placeholder and swaps in the secret
        run: |
          sed -i "s/YOUR_API_KEY_PLACEHOLDER/${{ secrets.THINGSPEAK_API_KEY }}/g" index.html
          
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the entire repository directory
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
